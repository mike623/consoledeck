<!doctype html>
<html><head><meta charset="utf-8"><title>ConsoleDeck Actions</title><link rel="stylesheet" href="style.css">
<style>
  /* Admin panel layout from the Panna Cotta design: toolbar, then profiles rail | deck canvas | inspector */
  :root { --panel: rgba(244,236,220,0.72); --panel-strong: rgba(246,241,232,0.92); --border: rgba(33,31,27,0.10); --border-strong: rgba(33,31,27,0.17);
    --inset: rgba(255,255,255,0.6); --faint: #a99f8c; --matcha: oklch(0.52 0.07 130); --hover: rgba(0,0,0,0.04); --well: rgba(255,255,255,0.6); }
  @media (prefers-color-scheme: dark) {
    :root { --panel: rgba(26,28,32,0.72); --panel-strong: rgba(29,31,36,0.92); --border: rgba(255,255,255,0.09); --border-strong: rgba(255,255,255,0.15);
      --inset: rgba(255,255,255,0.05); --faint: #6c665a; --matcha: oklch(0.66 0.07 130); --hover: rgba(255,255,255,0.05); --well: rgba(0,0,0,0.25); }
  }
  html, body { height: 100%; }
  #root { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  body { padding: 0; display: flex; flex-direction: column; overflow: hidden;
    background: radial-gradient(1100px 620px at 12% -8%, rgba(255,255,255,.55), transparent 60%), radial-gradient(820px 700px at 104% 112%, rgba(33,31,27,.045), transparent 60%), var(--bg); }
  @media (prefers-color-scheme: dark) {
    body { background: radial-gradient(1100px 620px at 12% -8%, rgba(255,255,255,.045), transparent 60%), radial-gradient(820px 700px at 104% 112%, rgba(0,0,0,.45), transparent 60%), var(--bg); }
  }
  /* the design's soft blurred blobs behind the glass */
  body::before, body::after { content: ""; position: fixed; border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: 0; }
  body::before { top: -120px; right: -100px; width: 420px; height: 420px; opacity: .6;
    background: radial-gradient(circle, color-mix(in oklch, var(--accent) 35%, transparent), transparent 70%); }
  body::after { bottom: -100px; left: -80px; width: 360px; height: 360px; opacity: .4; background: radial-gradient(circle, oklch(0.72 0.15 280), transparent 70%); }
  @media (prefers-color-scheme: dark) { body::after { opacity: .25; } }
  #root { position: relative; z-index: 1; }
  svg.i { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .label { font-size: 9.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }

  .toolbar { flex: none; height: 42px; display: flex; align-items: center; gap: 4px; padding: 0 12px;
    border-bottom: 0.5px solid var(--border); background: rgba(255,255,255,0.4); -webkit-backdrop-filter: blur(20px) saturate(140%); backdrop-filter: blur(20px) saturate(140%); }
  @media (prefers-color-scheme: dark) { .toolbar { background: rgba(20,20,24,0.5); } }
  .brand { display: flex; align-items: center; gap: 9px; padding-right: 10px; font: 600 15px var(--font-serif); white-space: nowrap; }
  .divider { width: 1px; height: 16px; background: var(--border); margin: 0 4px; }
  .chip-btn { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px 4px 8px; border-radius: 7px; font-size: 11.5px; font-weight: 600;
    background: var(--hover); border: 0.5px solid var(--border); white-space: nowrap; }
  .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); flex: none; }
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 999px; font-size: 9.5px; font-weight: 600;
    letter-spacing: .06em; text-transform: uppercase; color: var(--matcha); white-space: nowrap;
    background: color-mix(in oklch, var(--matcha) 13%, transparent); border: 0.5px solid color-mix(in oklch, var(--matcha) 30%, transparent); }
  .pill .dot { background: currentColor; }
  .pill.waiting { color: var(--warn); background: color-mix(in oklch, var(--warn) 13%, transparent); border-color: color-mix(in oklch, var(--warn) 30%, transparent); }
  .icon-btn { all: unset; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 28px; min-width: 28px;
    padding: 0 6px; box-sizing: border-box; border-radius: 7px; color: var(--muted); font-size: 11.5px; font-weight: 600; }
  .icon-btn:hover { background: var(--hover); color: var(--fg); }

  .zones { flex: 1; min-height: 0; display: flex; gap: 14px; padding: 14px; }
  .glass { position: relative; background: var(--panel); border: 0.5px solid var(--border); border-radius: 18px;
    -webkit-backdrop-filter: blur(20px) saturate(140%); backdrop-filter: blur(20px) saturate(140%);
    box-shadow: 0 0 0 0.5px var(--border-strong) inset, 0 1px 0 var(--inset) inset, 0 4px 18px rgba(33,31,27,0.07); }
  @media (prefers-color-scheme: dark) { .glass { box-shadow: 0 0 0 0.5px var(--border-strong) inset, 0 1px 0 var(--inset) inset, 0 6px 20px rgba(0,0,0,0.28); } }

  /* left rail */
  .rail { width: 196px; flex: none; padding: 14px 10px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
  .rail-head { padding: 0 8px; display: flex; justify-content: space-between; align-items: center; }
  .count { font-size: 9px; padding: 1px 5px; border-radius: 4px; background: var(--hover); color: var(--faint); letter-spacing: 0; }
  .list { display: flex; flex-direction: column; gap: 2px; position: relative; }
  .row-btn { all: unset; cursor: pointer; position: relative; display: flex; align-items: center; gap: 10px; padding: 7px 9px; border-radius: 9px;
    font-size: 12.5px; font-weight: 500; color: var(--muted); }
  .row-btn:hover { background: var(--hover); }
  .row-btn.on { background: var(--hover); color: var(--fg); font-weight: 600; }
  .row-btn.on::before { content: ""; position: absolute; left: -10px; top: 50%; transform: translateY(-50%); width: 3px; height: 16px; border-radius: 2px; background: var(--accent); }
  .row-btn .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-btn.child { padding-left: 22px; }
  .badge { width: 26px; height: 26px; border-radius: 7px; flex: none; display: flex; align-items: center; justify-content: center;
    background: var(--hover); color: var(--muted); font-size: 11px; font-weight: 700; }
  .row-btn.on .badge { color: #fff; background: linear-gradient(160deg, color-mix(in oklch, var(--accent) 95%, white), var(--accent));
    box-shadow: 0 0.5px 0 rgba(255,255,255,0.4) inset, 0 2px 6px color-mix(in oklch, var(--accent) 35%, transparent); }
  .row-btn.add { color: var(--faint); font-size: 12px; }
  .row-btn.add .badge { background: transparent; border: 1px dashed var(--border-strong); color: var(--faint); }
  .pages { border-top: 0.5px solid var(--border); padding-top: 14px; }
  .pages .rail-head { padding-bottom: 8px; }
  .page-btn { padding: 6px 9px; border-radius: 7px; font-size: 12px; }
  .num { width: 18px; height: 18px; border-radius: 5px; flex: none; display: flex; align-items: center; justify-content: center; font-size: 9.5px; font-weight: 700;
    font-variant-numeric: tabular-nums; background: var(--hover); color: var(--faint); }
  .page-btn.on .num { background: color-mix(in oklch, var(--accent) 22%, transparent); color: var(--accent); }
  .page-btn.on::before { display: none; }
  .mini { all: unset; cursor: pointer; width: 18px; height: 18px; border-radius: 5px; display: flex; align-items: center; justify-content: center; color: var(--faint); }
  .mini:hover { background: var(--hover); color: var(--fg); }
  .rail-foot { margin-top: auto; padding: 10px 8px 0; border-top: 0.5px solid var(--border); font-size: 10px; color: var(--faint); line-height: 1.5; }
  .rail-foot .line { display: flex; align-items: center; gap: 5px; }
  .rail-foot .line .dot { background: var(--matcha); }
  .rail-foot b { color: var(--muted); font-weight: 500; }
  .rail .menu { left: 8px; right: 8px; min-width: 0; }

  /* center canvas */
  .canvas { flex: 1; min-width: 0; padding: 64px 24px 0; display: flex; flex-direction: column; align-items: center; overflow: hidden; }
  .device { flex: 1; justify-content: center; padding-bottom: 18px; }
  .tray { align-self: stretch; margin: 0 -24px; padding: 12px 18px 14px; border-top: 0.5px solid var(--border); border-radius: 0 0 18px 18px;
    background: color-mix(in srgb, var(--bg) 70%, transparent); display: flex; flex-direction: column; gap: 6px; }
  .tray .field { flex-direction: row; align-items: center; gap: 10px; }
  .tray .field > label { flex: none; }
  .tray .field > div { flex: 1; }
  .tray select.chip-add { flex: 0 1 170px; min-width: 90px; }
  .corner { position: absolute; top: 16px; }
  .corner.left { left: 16px; } .corner.right { right: 16px; }
  .seg { display: inline-flex; padding: 3px; border: 0.5px solid var(--border); border-radius: 9px; }
  .seg button { flex: none; padding: 4px 11px; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
  .seg button .n { font-variant-numeric: tabular-nums; font-size: 10px; color: var(--faint); }
  .seg button.on .n { color: var(--accent); }
  .device { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .device .grid { gap: 12px; }
  .device .row { gap: 12px; }
  .device .key { all: unset; box-sizing: border-box; cursor: pointer; width: 84px; height: 84px; border-radius: 12px; display: grid; grid-template-rows: 1fr auto;
    justify-items: center; align-items: center; row-gap: 6px; padding: 12px 6px 10px; background: rgba(0,0,0,0.025); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08);
    color: var(--fg); transition: background .15s ease, box-shadow .15s ease; }
  @media (prefers-color-scheme: dark) { .device .key { background: rgba(255,255,255,0.035); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.09); } }
  .device .key:hover { background: var(--hover); }
  .device .key { position: relative; }
  .device .key i { position: absolute; top: 6px; left: 8px; font: 600 10px/1 var(--font-serif); font-style: normal; color: var(--faint); }
  .device .key .glyph { align-self: end; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; }
  .device .key .glyph svg.i { width: 28px; height: 28px; stroke-width: 1.5; }
  .device .key.unset .glyph svg.i { width: 16px; height: 16px; color: var(--faint); }
  .device .key.on i { color: var(--accent); }
  .device .key span { font-size: 10px; font-weight: 500; line-height: 1.25; color: var(--muted); max-width: 100%; padding: 0 4px; box-sizing: border-box;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .device .key:not(.own) .glyph { opacity: .55; }
  .device .key.unset { background: transparent; box-shadow: none; border: 1px dashed var(--border-strong); }
  .device .key.on { box-shadow: 0 0 0 1.5px var(--accent), 0 0 0 4px color-mix(in oklch, var(--accent) 22%, transparent); }
  .meta { display: flex; gap: 10px; align-items: center; font-size: 11px; color: var(--muted); }
  .meta .sep { opacity: .5; }

  /* right inspector */
  .inspector { width: 300px; flex: none; padding: 14px; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .ins-head { display: flex; align-items: center; gap: 10px; }
  .ins-tile { width: 36px; height: 36px; border-radius: 9px; flex: none; display: flex; align-items: center; justify-content: center;
    background: var(--hover); border: 1px solid var(--border); }
  .ins-tile svg.i { width: 20px; height: 20px; stroke-width: 1.6; }
  .ins-title { font-size: 14px; font-weight: 600; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ins-body { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; margin: 0 -4px; padding: 0 4px; }
  .field { display: flex; flex-direction: column; align-items: stretch; gap: 5px; margin: 0; }
  .field > label { text-align: left; font-size: 9.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
  .inspector select, .inspector input, .inspector textarea { background: var(--well); border: 0.5px solid var(--border-strong); border-radius: 8px; padding: 7px 9px; font-size: 12px; width: 100%; }
  .inspector .bar > * { min-width: 0; }
  .ins-foot { display: flex; gap: 6px; align-items: center; padding-top: 10px; border-top: 0.5px solid var(--border); }
  .ins-foot .btn { display: inline-flex; align-items: center; gap: 5px; padding: 6px 10px; border-radius: 7px; font-size: 11.5px; font-weight: 600; border-width: 0.5px; }
  .btn.danger { background: transparent; color: oklch(0.6 0.18 25); border-color: oklch(0.6 0.18 25 / 0.4); }

  /* adaptive: narrower windows shrink the side panels, then stack everything in one scrolling column */
  .device .key { width: clamp(64px, 7vw, 84px); height: clamp(64px, 7vw, 84px); }
  @media (max-width: 1080px) {
    .rail { width: 168px; } .inspector { width: 260px; }
    .icon-btn .t { display: none; }
  }
  @media (max-width: 860px) {
    body { overflow: auto; }
    #root { flex: none; }
    .zones { flex-direction: column; overflow: visible; min-height: auto; }
    .rail { width: auto; flex-direction: row; flex-wrap: wrap; gap: 14px; overflow: visible; }
    .rail > div { flex: 1 1 220px; }
    .rail-foot { margin-top: 0; border-top: 0; padding-top: 0; }
    .pages { border-top: 0; padding-top: 0; }
    .canvas { min-height: 460px; padding-top: 60px; }
    .inspector { width: auto; }
    .ins-body { overflow: visible; }
  }
  @media (max-width: 520px) {
    .corner.right { top: 52px; left: 16px; right: auto; }
    .canvas { padding-top: 96px; }
    .tray .field { flex-direction: column; align-items: stretch; }
  }
  .warn-line { font-size: 11px; }
</style></head>
<body><div id="root"></div>
<script src="common.js"></script>
<script>
/** Built into the app; every other action type is a plugin. */
const CORE_KINDS = [["none", "None"], ["repeat", "Repeat Keys"]];
/** Runs that land in the app in front, so testing them from this window would type into it. */
const TYPES_INTO_FRONT_APP = ["keys", "type", "password"];
const NEEDS_ACCESSIBILITY = [...TYPES_INTO_FRONT_APP, "media"];

let S;                 // latest state from the app
let selected = 1;
let gesture = "press";
let page = 1;
let profileId;         // undefined until first render; null = Default
let recording = false;
let menuOpen = false;
/** Select options from plugin commands, by "plugin.field"; refetched on focus (an import may finish in another app). */
let fetched = {};
window.addEventListener("focus", () => { fetched = {}; if (S) render(); });

const cfg = () => S.config;
/** Selected profile, or null for Default (also when the profile was deleted elsewhere). */
const profile = () => (profileId && cfg().profiles[profileId] ? profileId : null);
/** What `profile` itself sets for button n. undefined in a profile means "use default". */
const own = (n) => (profile() ? cfg().profiles[profile()].buttons : cfg().buttons)[buttonKey(n, gesture, page)];
/** What pressing button n does while this profile is active. */
/** What "Use Default" falls back to: the app's profile for a game's, else Default. */
const fallbackName = () => cfg().profiles[parentOf(profile())]?.name ?? "Default";
const effective = (n) => actionFor(cfg(), n, gesture, profile(), page);

/** Every edit is saved straight away, like deck.py. */
const setOwn = (action) => invoke("set_action", { profile: profile(), page, gesture, button: selected, action });

function setKind(type) {
  if (type === "inherit") return setOwn(null);
  // a value only carries over between kinds that store the same thing (a key combo)
  const combo = ["key", "repeat"];
  const old = own(selected);
  const keep = old && (old.type === type || (combo.includes(old.type) && combo.includes(type)));
  setOwn(keep ? { ...old, type } : { type });
}

const setValue = (value) => setOwn({ ...(own(selected) ?? { type: "none" }), value });

/** The first field is stored as value (what deck.py reads), the others in values. */
const getField = (i, f) => (i === 0 ? own(selected)?.value : own(selected)?.values?.[f.id]) ?? "";
function setField(i, f, v) {
  if (i === 0) return setValue(v);
  const a = own(selected) ?? { type: "none" };
  setOwn({ ...a, values: { ...(a.values ?? {}), [f.id]: v } });
}

async function addProfile(app) {
  menuOpen = false;
  await invoke("add_profile", { id: app.id, name: app.name });
  profileId = app.id;
  render();
}

// Recording: the next key press (with modifiers) becomes the combo; swallowed so ⌘W etc. don't act on the window.
let recorded = null; // where the combo goes
window.addEventListener("keydown", (e) => {
  if (!recording) return;
  e.preventDefault();
  e.stopPropagation();
  const combo = comboFromEvent(e);
  if (combo) {
    recording = false;
    recorded(combo);
  }
}, true);

function keyRecorder(value, set) {
  return el("button", { class: "btn", style: "font-family: ui-monospace, monospace",
    onclick: () => { recording = !recording; recorded = set; render(); } },
    recording ? "Press keys…" : value ? comboSymbols(value) : "Record");
}

function accessibilityNote() {
  if (!S.mac || S.accessibility) return null;
  return el("div", { class: "bar warn" }, el("span", { class: "grow" }, "Needs Accessibility permission to press keys"),
    el("button", { class: "btn", onclick: () => invoke("allow_accessibility") }, "Allow…"));
}

const note = (text) => text && el("div", { class: "small muted" }, text);
const field = (label, ...control) => el("div", { class: "field" }, el("label", {}, label), el("div", {}, ...control));
const textInput = (value, set, attrs) => el("input", { type: "text", value, onchange: (e) => set(e.target.value), ...attrs });
const textArea = (value, set, attrs) => {
  const t = el("textarea", { onchange: (e) => set(e.target.value), ...attrs });
  t.value = value;
  return t;
};

/** A select's options: listed in the manifest, input languages, or printed by the plugin's command. */
function selectOptions(p, f) {
  const listed = (f.options ?? []).filter(forThisOS).map((o) => [o.value, o.label]);
  if (!f.optionsFrom) return listed;
  if (f.optionsFrom[0] === "inputSources") return listed.concat(Object.entries(names.input));
  const key = `${p.id}.${f.id}`;
  if (!fetched[key]) {
    fetched[key] = { list: null };
    invoke("plugin_options", { id: p.id, field: f.id }).then((list) => { fetched[key].list = list; render(); });
  }
  return listed.concat(fetched[key].list ?? []);
}

function fieldEditor(p, f, i) {
  const value = getField(i, f);
  const set = (v) => setField(i, f, v);
  const mono = f.monospace ? { style: "font-family: ui-monospace, Consolas, monospace" } : {};
  let control;
  switch (f.type) {
    case "textarea": control = textArea(value, set, { rows: f.monospace ? 4 : 3, placeholder: f.placeholder ?? "", ...mono }); break;
    case "app": control = el("div", { class: "bar" }, textInput(value, set, { placeholder: f.placeholder ?? "" }),
      el("button", { class: "btn", onclick: async () => { const a = await invoke("pick_app"); if (a) set(a.open); } }, "Choose…")); break;
    case "keys": control = keyRecorder(value, set); break;
    case "password": {
      const input = el("input", { type: "password", placeholder: value ? "Saved, type to replace" : "Not set",
        onkeydown: (e) => e.key === "Enter" && save() });
      const save = async () => {
        const sealed = input.value && await invoke("seal_password", { password: input.value });
        if (sealed) set(sealed);
      };
      control = el("div", { class: "bar" }, input, el("button", { class: "btn", onclick: save }, "Save"));
      break;
    }
    case "select": {
      const options = selectOptions(p, f);
      control = el("select", { class: "grow", onchange: (e) => set(e.target.value) },
        !value ? el("option", { value: "" }, "Choose…")
          : !options.some(([v]) => v === value) && el("option", { value, selected: true }, `${value} (not available)`),
        options.map(([v, label]) => el("option", { value: v, selected: v === value }, label)));
      break;
    }
    default: control = textInput(value, set, { placeholder: f.placeholder ?? "", ...mono });
  }
  if (f.button) {
    control = el("div", { class: "bar" }, control, el("button", { class: "btn", onclick: async () => {
      const v = await invoke("plugin_button", { id: p.id, field: f.id });
      fetched = {};
      if (v) set(v); else render();
    } }, f.button.label));
  }
  return field(f.label, control);
}

function valueEditor(kind) {
  const value = own(selected)?.value ?? "";
  if (kind === "none") return null;
  if (kind === "inherit") return field(fallbackName(),
    el("span", {}, shortLabel(actionFor(cfg(), selected, gesture, parentOf(profile()), page))));
  if (kind === "repeat") return [field("Keys", keyRecorder(value, setValue)),
    note(`Press the button to start pressing these keys every ${cfg().repeatSeconds ?? 60}s, again to stop. Change the interval with "repeatSeconds" in deck.json.`),
    accessibilityNote()];
  const p = pluginFor(kind);
  if (!p) return el("div", { class: "bar warn" }, el("span", { class: "grow" }, `The ${kind} plugin isn't installed, so this button does nothing.`),
    el("button", { class: "btn", onclick: () => invoke("show_plugins") }, "Plugins…"));
  const run = runOf(p, own(selected) ?? {});
  const option = p.fields[0]?.options?.find((o) => o.value === value);
  return [...p.fields.map((f, i) => fieldEditor(p, f, i)), note(option?.note), note(p.note),
    run && NEEDS_ACCESSIBILITY.some((k) => k in run) && accessibilityNote()];
}

/** Action types for the menu: the core ones and every installed plugin, plus the current one if its plugin is gone. */
function kinds(current) {
  const list = Object.values(plugins).filter((p) => !displayOnly(p)).map((p) => [p.id, p.name]);
  if (!plugins.system) list.push(["system", "System"]); // the editor and cheat sheet are always there
  list.sort((a, b) => a[1].localeCompare(b[1]));
  const all = [CORE_KINDS[0], ...list, CORE_KINDS[1]];
  if (!["inherit", "none", "repeat"].includes(current) && !pluginFor(current)) all.push([current, `${current} (not installed)`]);
  return all;
}

/** Plugins that only show something (CPU Usage): they go on the phone's display row, not on a button. */
const displayOnly = (p) => p.live && !p.run && !p.fields[0]?.options?.some((o) => o.run);

/** "Last Epoch Character: Fire Res", "CPU Usage". */
function tileName(a) {
  const p = pluginFor(a.type);
  if (!p) return `${a.type} (not installed)`;
  const o = a.value && p.fields[0]?.options?.find((o) => o.value === a.value);
  return o ? `${p.name}: ${o.label}` : p.name;
}

/** Tiles under the buttons on the phone companion. A profile uses the default ones until it changes them;
 * a game's profile adds its own to its app's (Boosteroid · Last Epoch shows Boosteroid's too). */
function displayBar() {
  const mine = profile() ? cfg().profiles[profile()].displays : cfg().displays ?? [];
  const inherited = cfg().profiles[parentOf(profile())]?.displays;
  const displays = mine ?? (inherited ? [] : cfg().displays ?? []);
  const set = (list) => invoke("set_displays", { profile: profile(), displays: list });
  const addable = Object.values(plugins).filter((p) => p.live).sort((a, b) => a.name.localeCompare(b.name));
  // choices a press can't run are tiles (Last Epoch Character's stats, Boosteroid's idle countdown)
  const tileOptions = (p) => p.run ? [] : p.fields[0]?.options?.filter((o) => !o.run) ?? [];
  return field("Phone shows",
    el("div", { class: "bar", style: "flex-wrap: wrap" },
      // inherited tiles are dashed and muted, like the phone draws keys from a fallback profile
      (inherited ?? []).map((a) => el("span", { class: "chip inherited", title: `From ${fallbackName()}` }, tileName(a))),
      displays.map((a, i) => el("span", { class: "chip" }, tileName(a),
        el("button", { title: "Remove from the phone", "aria-label": `Remove ${tileName(a)}`,
          onclick: () => set(displays.filter((_, j) => j !== i)) }, "✕"))),
      el("select", { class: "chip-add", onchange: (e) => e.target.value && set([...displays, JSON.parse(e.target.value)]) },
        el("option", { value: "" }, "Add…"),
        // one tile per such choice; a plugin whose live only tells the game (contextFor) has no tile otherwise
        addable.map((p) => tileOptions(p).length
          ? el("optgroup", { label: p.name }, tileOptions(p).map((o) => el("option", { value: JSON.stringify({ type: p.id, value: o.value }) }, o.label)))
          : !p.contextFor && el("option", { value: JSON.stringify({ type: p.id }) }, p.name))),
      profile() && (mine ? el("button", { class: "btn", title: "Show the tiles this falls back to", onclick: () => set(null) }, `Use ${fallbackName()}`)
        : el("span", { class: "muted" }, `(${fallbackName()})`))));
}

const ICONS = {
  home: '<path d="M3 11l9-8 9 8v9a2 2 0 0 1-2 2h-4v-7h-6v7H5a2 2 0 0 1-2-2v-9z"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  layers: '<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5M3 18l9 5 9-5"/>',
  trash: '<path d="M5 7h14M9 7V4h6v3M7 7l1 13a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2l1-13"/>',
  play: '<path d="M7 5l12 7-12 7z"/>',
  arrowD: '<path d="M12 5v14M6 13l6 6 6-6"/>',
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
  app: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
  cmd: '<path d="M8 8a2 2 0 1 1 2-2v12a2 2 0 1 1-2-2h8a2 2 0 1 1-2 2V6a2 2 0 1 1 2 2H8z"/>',
  terminal: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M13 15h4"/>',
  keyboard: '<rect x="2" y="6" width="20" height="13" rx="2"/><path d="M6 10h0M10 10h0M14 10h0M18 10h0M6 14h0M10 14h0M14 14h0M18 14h0M7 17h10"/>',
  lock: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  spark: '<path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>',
  zap: '<path d="M13 3L4 14h7l-1 7 9-11h-7z"/>',
  reset: '<path d="M4 12a8 8 0 1 0 3-6"/><path d="M4 4v5h5"/>',
  next: '<path d="M5 5l10 7-10 7z"/><path d="M17 5v14"/>',
  prev: '<path d="M19 5l-10 7 10 7z"/><path d="M7 5v14"/>',
  broadcast: '<circle cx="12" cy="12" r="2"/><path d="M8 8a6 6 0 0 0 0 8M16 8a6 6 0 0 1 0 8M5 5a10 10 0 0 0 0 14M19 5a10 10 0 0 1 0 14"/>',
};
/** The design's action categories (data.js): colour per category, icon per action type. */
const CATEGORY = { browser: "oklch(0.50 0.075 250)", system: "oklch(0.53 0.07 135)", media: "oklch(0.57 0.11 38)", shortcut: "oklch(0.52 0.075 315)" };
const TYPE_LOOK = {
  url: ["globe", "browser"], app: ["app", "system"], input: ["globe", "system"], vpn: ["zap", "system"], media: ["play", "media"],
  key: ["cmd", "shortcut"], type: ["keyboard", "shortcut"], password: ["lock", "shortcut"], script: ["terminal", "shortcut"], repeat: ["reset", "shortcut"],
};
/** Icon and colour for an action; System's page buttons get arrows, plugins without a mapping a spark. */
function look(a) {
  if (a.type === "system" && a.value === "nextpage") return ["next", CATEGORY.system];
  if (a.type === "system" && a.value === "prevpage") return ["prev", CATEGORY.system];
  const [name, cat] = TYPE_LOOK[a.type] ?? ["spark", pluginFor(a.type)?.contextFor ? "media" : "system"];
  return [name, CATEGORY[cat]];
}
function icon(name) {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("viewBox", "0 0 24 24");
  s.setAttribute("class", "i");
  s.innerHTML = ICONS[name];
  return s;
}

/** Panna Cotta's plate mark: a 3×3 of dots with the vermilion one in the middle. */
function brandMark() {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("viewBox", "0 0 100 100");
  s.setAttribute("width", "22"); s.setAttribute("height", "22");
  s.innerHTML = '<rect width="100" height="100" rx="24" fill="#EFE7D6"/><circle cx="50" cy="50" r="31" fill="#F6F1E8" stroke="#211F1B" stroke-opacity="0.16" stroke-width="1.4"/>'
    + [35, 50, 65].flatMap((y, r) => [35, 50, 65].map((x, c) => r === 1 && c === 1
      ? `<circle cx="${x}" cy="${y}" r="4.8" fill="#C8472E"/>` : `<circle cx="${x}" cy="${y}" r="3.8" fill="#211F1B" fill-opacity="0.82"/>`)).join("");
  return s;
}

const connected = () => S.status.startsWith("Listening");

function toolbar() {
  return el("div", { class: "toolbar" },
    el("div", { class: "brand" }, brandMark(), "ConsoleDeck"),
    el("div", { class: "divider" }),
    el("span", { class: "chip-btn", title: "Profile being edited" }, el("span", { class: "dot" }),
      profile() ? cfg().profiles[profile()].name : "Default"),
    el("div", { style: "flex: 1" }),
    el("span", { class: `pill${connected() ? "" : " waiting"}`, title: S.status }, el("span", { class: "dot" }),
      connected() ? "Deck connected" : "No deck"),
    el("div", { class: "divider" }),
    el("button", { class: "icon-btn", title: "Install and manage action plugins", onclick: () => invoke("show_plugins") }, icon("layers"), el("span", { class: "t" }, "Plugins")));
}

/** Initials for a profile's badge: "Boosteroid · Last Epoch" -> "LE". */
const initials = (name) => (name.split(" · ").pop().match(/\b\w/g) ?? ["?"]).slice(0, 2).join("").toUpperCase();

function profilesRail() {
  // a game's profile ("app/Game") sits under its app's
  const entries = Object.entries(cfg().profiles)
    .sort((a, b) => (parentOf(a[0]) ? cfg().profiles[parentOf(a[0])]?.name + a[1].name : a[1].name)
      .localeCompare(parentOf(b[0]) ? cfg().profiles[parentOf(b[0])]?.name + b[1].name : b[1].name));
  const addable = S.recentApps.filter((a) => !cfg().profiles[a.id]);
  const pick = (id) => { profileId = id; page = 1; recording = false; menuOpen = false; render(); };
  const count = Math.max(pageCount(cfg(), profile()), page);
  const go = (p) => { page = p; recording = false; render(); };
  return el("div", { class: "glass rail" },
    el("div", {},
      el("div", { class: "rail-head label" }, el("span", {}, "Profiles"), el("span", { class: "count" }, `${entries.length + 1}`)),
      el("div", { class: "list", style: "margin-top: 10px" },
        el("button", { class: `row-btn${!profile() ? " on" : ""}`, onclick: () => pick(null) },
          el("div", { class: "badge" }, icon("home")), el("span", { class: "name" }, "Default")),
        entries.map(([id, p]) => el("button", { class: `row-btn${id === profile() ? " on" : ""}${parentOf(id) ? " child" : ""}`, title: id, onclick: () => pick(id) },
          el("div", { class: "badge" }, initials(p.name)), el("span", { class: "name" }, p.name.split(" · ").pop()))),
        el("button", { class: "row-btn add", title: "Add a profile for an app", onclick: () => { menuOpen = !menuOpen; render(); } },
          el("div", { class: "badge" }, icon("plus")), "New profile"),
        menuOpen && el("div", { class: "menu", style: "top: 100%" },
          addable.map((a) => el("button", { onclick: () => addProfile(a) }, a.name)),
          addable.length > 0 && el("hr"),
          el("button", { onclick: async () => { const a = await invoke("pick_app"); if (a) addProfile(a); else { menuOpen = false; render(); } } }, "Choose App…")))),
    el("div", { class: "pages" },
      el("div", { class: "rail-head label" },
        el("span", {}, `Pages · ${profile() ? cfg().profiles[profile()].name.split(" · ").pop() : "Default"}`),
        el("button", { class: "mini", title: "Add a page; give a button Next Page (System) to reach it", onclick: () => go(count + 1) }, icon("plus"))),
      el("div", { class: "list" }, Array.from({ length: count }, (_, i) => {
        const set = Object.keys(profile() ? cfg().profiles[profile()].buttons : cfg().buttons).filter((k) => pageOf(k) === i + 1 && !k.includes(".long") && !k.includes(".double")).length;
        return el("button", { class: `row-btn page-btn${i + 1 === page ? " on" : ""}`, onclick: () => go(i + 1) },
          el("span", { class: "num" }, `${i + 1}`), `Page ${i + 1}`, el("span", { style: "flex: 1" }), el("span", { class: "count" }, `${set}`));
      }))),
    el("div", { class: "rail-foot" },
      el("div", { class: "line" }, el("span", { class: "dot" }), el("b", {}, "Saved to deck.json")),
      profile() && el("button", { class: "icon-btn", style: "height: 24px; padding: 0; margin-top: 4px; font-size: 10.5px", title: "Delete this profile", onclick: async () => {
        const name = cfg().profiles[profile()].name;
        if (!confirm(`Delete the ${name} profile? Its button actions are removed. Buttons go back to the default actions in that app.`)) return;
        await invoke("delete_profile", { id: profile() });
        profileId = null;
      } }, icon("trash"), "Delete profile")));
}

function canvas() {
  const set = LAYOUT.flat().filter((n) => effective(n).type !== "none").length;
  return el("div", { class: "glass canvas" },
    el("div", { class: "corner left" }, el("div", { class: "seg" },
      Array.from({ length: Math.max(pageCount(cfg(), profile()), page) }, (_, i) =>
        el("button", { class: i + 1 === page ? "on" : "", onclick: () => { page = i + 1; recording = false; render(); } },
          `Page ${i + 1}`)))),
    el("div", { class: "corner right" }, el("div", { class: "seg" }, GESTURES.map(([g, title]) =>
      el("button", { class: g === gesture ? "on" : "", onclick: () => { gesture = g; recording = false; render(); } }, title)))),
    el("div", { class: "device" },
      el("div", { class: "grid" }, LAYOUT.map((row) => el("div", { class: "row" }, row.map((n) => {
        const a = effective(n);
        const unset = a.type === "none";
        const [name, color] = look(a);
        // own = set by this profile (or Default); unset = does nothing
        const cls = ["key", n === selected && "on", (!profile() || own(n)) && "own", unset && "unset"].filter(Boolean).join(" ");
        const ic = icon(unset ? "plus" : name);
        if (!unset) ic.style.color = color;
        return el("button", { class: cls, title: `Button ${n}`, onclick: () => { selected = n; recording = false; render(); } },
          el("i", {}, `${n}`), el("div", { class: "glyph" }, ic), el("span", {}, unset ? "" : shortLabel(a)));
      })))),
      el("div", { class: "meta" },
        el("span", { class: `pill${connected() ? "" : " waiting"}` }, el("span", { class: "dot" }), "Live"),
        el("span", { class: "sep" }, "·"), el("span", {}, "3-3-4"),
        el("span", { class: "sep" }, "·"), el("span", {}, `${set} of 10 set`))),
    // not in the design: the phone's live tiles belong to the profile, so they sit under its deck like the phone's docked strip
    el("div", { class: "tray" }, displayBar(), note("Live tiles under the buttons on the Phone Companion. They don't use a button.")));
}

function inspector() {
  const kind = own(selected)?.type ?? (profile() ? "inherit" : "none");
  const eff = effective(selected);
  const effPlugin = pluginFor(eff.type);
  const typesIntoFrontApp = eff.type === "repeat" || TYPES_INTO_FRONT_APP.some((k) => k in (osRun(effPlugin?.run) ?? {}));
  const gestureTitle = GESTURES.find(([g]) => g === gesture)[1];
  const calibrated = Object.values(cfg().pins).includes(selected);
  const title = shortLabel(eff);
  return el("div", { class: "glass inspector" },
    el("div", { class: "ins-head" },
      (() => { const [name, color] = look(eff); const t = el("div", { class: "ins-tile" }, icon(eff.type === "none" ? "plus" : name));
        t.style.color = eff.type === "none" ? "var(--faint)" : color; return t; })(),
      el("div", { style: "flex: 1; min-width: 0" },
        el("div", { class: "label" }, `Button ${selected} · ${gestureTitle}`),
        el("div", { class: "ins-title" }, title === "–" ? "Does nothing" : title))),
    el("div", { class: "ins-body" },
      field("Action",
        el("select", { onchange: (e) => setKind(e.target.value) },
          profile() && el("option", { value: "inherit", selected: kind === "inherit" }, `Use ${fallbackName()}`),
          kinds(kind).map(([k, label]) => el("option", { value: k, selected: k === kind }, label)))),
      ...[valueEditor(kind)].flat().filter(Boolean),
      !calibrated && el("div", { class: "warn warn-line" }, "⚠ Not calibrated yet"),
      gesture !== "press" && note("Buttons with long or double actions wait a moment to tell presses apart.")),
    el("div", { class: "ins-foot" },
      el("button", { class: "btn", disabled: !eff.value || typesIntoFrontApp || (eff.type !== "repeat" && !effPlugin),
        title: typesIntoFrontApp ? "Goes to the app in front; press the deck button in that app to test" : "Run it now",
        onclick: () => invoke("test_action", { action: eff }) }, icon("play"), "Test"),
      el("div", { style: "flex: 1" }),
      el("button", { class: "btn danger", disabled: !own(selected), title: profile() ? `Use ${fallbackName()} again` : "Make it do nothing",
        onclick: () => setOwn(null) }, icon("trash"), "Clear")));
}

function render() {
  document.getElementById("root").replaceChildren(toolbar(), el("div", { class: "zones" }, profilesRail(), canvas(), inspector()));
}

live((state) => {
  S = state;
  // start on the profile of the app you came from, if it has one
  if (profileId === undefined) profileId = cfg().profiles[S.frontApp?.id] ? S.frontApp.id : null;
  // don't yank the field someone is typing in
  if (["INPUT", "TEXTAREA"].includes(document.activeElement?.tagName) && document.hasFocus()) return;
  render();
});
// rechecks Accessibility while the note is up
setInterval(async () => {
  if (S?.mac && !S.accessibility) {
    S = await invoke("get_state");
    if (S.accessibility) render();
  }
}, 1500);
</script></body></html>
