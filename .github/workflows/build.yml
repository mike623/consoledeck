name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write  # tag builds attach the apps to a GitHub Release

jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            bundles: app
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: cargo test
      - run: npx -y @tauri-apps/cli@2 build --bundles ${{ matrix.bundles }}
        env:
          APPLE_SIGNING_IDENTITY: "-"  # no certificate on CI: signed ad-hoc
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent target/release/bundle/macos/ConsoleDeck.app ConsoleDeck-macos.zip
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: cp target/release/bundle/nsis/*-setup.exe ConsoleDeck-windows-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ConsoleDeck-${{ runner.os }}
          path: app/src-tauri/ConsoleDeck-*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes || true  # the other OS may have made it
          gh release upload "$GITHUB_REF_NAME" ConsoleDeck-* --clobber

  mac-swift:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v4
      - run: swift test
