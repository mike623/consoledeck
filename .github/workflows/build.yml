name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write  # tag builds attach the apps to a GitHub Release

jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            bundles: app
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true  # app/plugins: the plugins bundled inside the app
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: cargo test
      - run: ../build.sh
        env:
          APPLE_SIGNING_IDENTITY: "-"  # no certificate on CI: signed ad-hoc
          # signs the updater bundles; missing on forks' PRs, which then build without them
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --keepParent target/release/bundle/macos/ConsoleDeck.app ConsoleDeck-macos.zip
          for f in target/release/bundle/macos/ConsoleDeck.app.tar.gz*; do cp "$f" "ConsoleDeck-macos.app${f#*.app}"; done
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: for f in target/release/bundle/nsis/*-setup.exe*; do cp "$f" "ConsoleDeck-windows-setup${f#*-setup}"; done
      - uses: actions/upload-artifact@v4
        with:
          name: ConsoleDeck-${{ runner.os }}
          path: app/src-tauri/ConsoleDeck-*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Release with updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version app/src-tauri/tauri.conf.json)
          # otherwise installed apps would offer this release forever
          [[ "$GITHUB_REF_NAME" == "v$version" ]] || { echo "Tag $GITHUB_REF_NAME doesn't match version $version in tauri.conf.json"; exit 1; }
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          jq -n --arg v "$version" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg url "$url" \
            --rawfile mac dist/ConsoleDeck-macos.app.tar.gz.sig --rawfile win dist/ConsoleDeck-windows-setup.exe.sig \
            '{version: $v, pub_date: $date, platforms: {
               "darwin-aarch64": {signature: $mac, url: "\($url)/ConsoleDeck-macos.app.tar.gz"},
               "windows-x86_64": {signature: $win, url: "\($url)/ConsoleDeck-windows-setup.exe"}}}' > dist/latest.json
          gh release create "$GITHUB_REF_NAME" --generate-notes dist/*
